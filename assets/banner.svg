<svg width="1280" height="440" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vishwakarma — Design intelligence for AI coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0b12"/>
      <stop offset="1" stop-color="#0f1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#3d5afe" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#6d3dfe" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0a0b12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="88" y1="150" x2="720" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d0ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d5afe"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#glow)"/>

  <!-- architect's-compass motif (Vishwakarma = the divine architect); low-opacity, right side -->
  <g transform="translate(1010 220)" opacity="0.5">
    <circle r="176" fill="none" stroke="#3d5afe" stroke-opacity="0.20" stroke-width="1"/>
    <circle r="128" fill="none" stroke="#8b5cf6" stroke-opacity="0.22" stroke-width="1"/>
    <circle r="80" fill="none" stroke="#ec4899" stroke-opacity="0.20" stroke-width="1"/>
    <circle r="30" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
    <line x1="-208" y1="0" x2="208" y2="0" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    <line x1="0" y1="-208" x2="0" y2="208" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    <line x1="-147" y1="-147" x2="147" y2="147" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <line x1="-147" y1="147" x2="147" y2="-147" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <circle r="4" fill="#3d5afe"/>
  </g>

  <!-- eyebrow -->
  <text x="90" y="112" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#8b93b8">OPEN SOURCE · APACHE&#8209;2.0 · TYPESCRIPT</text>

  <!-- wordmark -->
  <text x="86" y="212" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3.5" fill="url(#wordmark)">Vishwakarma</text>

  <!-- accent rule -->
  <rect x="90" y="238" width="150" height="4" rx="2" fill="url(#rule)"/>

  <!-- tagline -->
  <text x="90" y="290" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#e4e8f6">Design intelligence for AI coding agents.</text>
  <text x="90" y="326" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#9aa3c4">Teach any agent to build interfaces that look <tspan fill="#c9d1f5" font-style="italic">designed</tspan> — not generated — and give it the tools to prove it.</text>

  <!-- perceptual colour ramp (a nod to the OKLCh colour engine) -->
  <g transform="translate(90 366)">
    <rect x="0"   width="46" height="16" rx="3" fill="#eef1ff"/>
    <rect x="52"  width="46" height="16" rx="3" fill="#d6ddff"/>
    <rect x="104" width="46" height="16" rx="3" fill="#b3c1ff"/>
    <rect x="156" width="46" height="16" rx="3" fill="#8ba0ff"/>
    <rect x="208" width="46" height="16" rx="3" fill="#6f81fb"/>
    <rect x="260" width="46" height="16" rx="3" fill="#4a62f5"/>
    <rect x="312" width="46" height="16" rx="3" fill="#3d5afe"/>
    <rect x="364" width="46" height="16" rx="3" fill="#6d3dfe"/>
    <rect x="416" width="46" height="16" rx="3" fill="#8b5cf6"/>
    <rect x="468" width="46" height="16" rx="3" fill="#b84fd6"/>
    <rect x="520" width="46" height="16" rx="3" fill="#ec4899"/>
  </g>

  <!-- stat row -->
  <text x="90" y="416" font-family="'SFMono-Regular', 'Consolas', 'Liberation Mono', monospace" font-size="14" font-weight="500" letter-spacing="0.5" fill="#7b84a8">21 SKILLS<tspan fill="#3d5afe">&#160;·&#160;</tspan>406 RULES<tspan fill="#8b5cf6">&#160;·&#160;</tspan>18 PACKAGES<tspan fill="#ec4899">&#160;·&#160;</tspan>13 AGENTS<tspan fill="#22c55e">&#160;·&#160;</tspan>217 TESTS</text>
</svg>
